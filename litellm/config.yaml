# LiteLLM proxy config for the Nexus v2 cortex.
# Phase 1: define the model catalog + Redis cache + Postgres state.
# Phase 5+ orchestrator nodes call models by `model_name` here, never
# directly against provider SDKs — keeps provider swaps a config-only change.

model_list:
  # Primary generation model
  - model_name: groq-llama-3.3-70b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      temperature: 0.3
      max_tokens: 1024

  # Multimodal generation (Phase 15) — vision-capable Groq model.
  - model_name: groq-llama-4-scout
    litellm_params:
      model: groq/meta-llama/llama-4-scout-17b-16e-instruct
      api_key: os.environ/GROQ_API_KEY
      temperature: 0.3
      max_tokens: 1024

  # Small/fast model for follow-ups, query rewrites, classifier nodes
  - model_name: groq-llama-3.1-8b
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY
      temperature: 0.5
      max_tokens: 512

  # Fallback for guardrail micro-tasks (cheap, low-volume)
  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      temperature: 0.2
      max_tokens: 512

  # Optional OpenAI fallback for guardrails or evaluation
  - model_name: openai-gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      temperature: 0.2
      max_tokens: 512

router_settings:
  routing_strategy: simple-shuffle
  redis_host: redis
  redis_port: 6379
  enable_pre_call_checks: true

litellm_settings:
  drop_params: true
  set_verbose: false
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 3600
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  alerting: ["slack"]
  alerting_threshold: 60
