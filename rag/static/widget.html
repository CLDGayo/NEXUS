<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS Chat</title>
  <style>
    :root {
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --bg: #f8fafc;
      --user-bubble: #2563eb;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      font-size: 14px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .logo { font-size: 15px; font-weight: 800; color: var(--accent); letter-spacing: 2px; }
    .logo-sub { font-size: 11px; color: var(--text-muted); }

    #msgs {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      gap: 8px;
      user-select: none;
    }

    .empty-icon { font-size: 30px; opacity: 0.3; }
    .empty-title { font-size: 15px; font-weight: 600; color: var(--text); }

    .message { display: flex; flex-direction: column; max-width: 82%; }
    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 3px;
    }

    .message.assistant .bubble {
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
    }

    .sources-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }

    .source-chip {
      padding: 2px 7px;
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 500;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .typing { display: flex; gap: 4px; padding: 6px 2px; align-items: center; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%; background: #94a3b8;
      animation: bounce 1.1s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.18s; }
    .dot:nth-child(3) { animation-delay: 0.36s; }
    @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-4px); } }

    footer {
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      background: var(--bg);
      flex-shrink: 0;
    }

    .input-row { display: flex; gap: 8px; align-items: flex-end; }

    textarea {
      flex: 1;
      min-height: 40px;
      max-height: 120px;
      padding: 9px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13.5px;
      font-family: inherit;
      resize: none;
      outline: none;
      background: white;
      transition: border-color 0.12s;
      line-height: 1.5;
    }

    textarea:focus { border-color: var(--accent); }

    button.send {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--accent);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.12s;
    }

    button.send:hover:not(:disabled) { background: var(--accent-hover); }
    button.send:disabled { background: #94a3b8; cursor: not-allowed; }

    .hint { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 5px; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">NEXUS</div>
    <div class="logo-sub">Knowledge Base</div>
  </div>
</header>

<div id="msgs">
  <div class="empty">
    <div class="empty-icon">💬</div>
    <div class="empty-title">Ask me anything about the vault</div>
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea id="ta" rows="1" placeholder="Ask a question…"></textarea>
    <button class="send" id="send">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
  <div class="hint">Enter to send · Shift+Enter for new line</div>
</footer>

<script>
'use strict';

const msgsEl = document.getElementById('msgs');
const ta = document.getElementById('ta');
const sendBtn = document.getElementById('send');

let history = [];
let streaming = false;

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function md(text) {
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code style="background:#f1f5f9;padding:1px 4px;border-radius:3px">$1</code>')
    .replace(/\n/g,'<br>');
}

function scroll() { msgsEl.scrollTop = msgsEl.scrollHeight; }

function addMsg(role, html) {
  msgsEl.querySelector('.empty')?.remove();
  const wrap = document.createElement('div');
  wrap.className = `message ${role}`;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = html;
  wrap.appendChild(b);
  msgsEl.appendChild(wrap);
  scroll();
  return wrap;
}

function addTyping() {
  msgsEl.querySelector('.empty')?.remove();
  const el = document.createElement('div');
  el.id = 'typing';
  el.className = 'message assistant';
  el.innerHTML = `<div class="bubble"><div class="typing">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div></div>`;
  msgsEl.appendChild(el);
  scroll();
  return el;
}

ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
ta.addEventListener('input', () => {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
});
sendBtn.addEventListener('click', send);

async function send() {
  if (streaming) return;
  const q = ta.value.trim();
  if (!q) return;

  ta.value = ''; ta.style.height = 'auto';
  sendBtn.disabled = true;
  streaming = true;

  addMsg('user', esc(q));
  const typing = addTyping();

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, history }),
    });

    if (!res.ok) throw new Error('Request failed');

    typing.remove();
    const wrap = document.createElement('div');
    wrap.className = 'message assistant';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    wrap.appendChild(bubble);
    msgsEl.appendChild(wrap);

    let full = '', sources = [];
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') continue;
        try {
          const ev = JSON.parse(payload);
          if (ev.type === 'token') { full += ev.content; bubble.innerHTML = md(full); scroll(); }
          else if (ev.type === 'sources') { sources = ev.items; }
        } catch {}
      }
    }

    if (sources.length) {
      const row = document.createElement('div');
      row.className = 'sources-row';
      row.innerHTML = sources.map(s =>
        `<span class="source-chip">${esc(s.file.split('/').pop().replace(/\.md$/,''))}</span>`
      ).join('');
      wrap.appendChild(row);
    }

    history.push({ role: 'user', content: q });
    history.push({ role: 'assistant', content: full });
    if (history.length > 12) history = history.slice(-12);
    scroll();

  } catch {
    typing?.remove();
    addMsg('assistant', 'Sorry, something went wrong.');
  }

  sendBtn.disabled = false;
  streaming = false;
  ta.focus();
}
</script>
</body>
</html>
