[project]
name = "nexus-rag"
version = "0.1.0"
description = "NEXUS personal RAG chatbot — Obsidian vault × Qdrant × Groq"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client[fastembed]>=1.14.0",
    # Direct pin so a qdrant-client bump can't silently drop or relocate
    # `TextCrossEncoder`. See rag/retrieval/rerank.py for the drift history.
    "fastembed>=0.4.0,<1.0.0",
    "groq>=0.13.0",
    "python-frontmatter>=1.1.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Phase 30.1 ripped aiosqlite out of every runtime router/service that
    # touched rag/data/nexus.db (the 5 legacy tables). The dependency stays
    # pinned because ``rag/ingest_v2/graph_db.py`` still backs the wikilink
    # resolver with a separate on-disk SQLite (``rag/data/nexus_graph.db``);
    # a future phase will fold that into Postgres and this pin can drop.
    "aiosqlite>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "watchdog>=6.0.0",
    "tiktoken>=0.8.0",
    "rich>=13.0.0",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
    # Phase 27 Part 1 — IAM stack.
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "fastapi-users[sqlalchemy]>=14.0.0,<16",
    "asyncpg>=0.29.0,<0.31",
    "alembic>=1.13.0,<2",
    "email-validator>=2.1.0",
    # Phase 28 Part 2 — Minio-backed avatar uploads.
    "aioboto3>=13.0.0,<15",
    "pillow>=11.0.0,<12",
    # Backs the BM25 sparse retrieval arm in rag/retrieval/sparse.py; mirrors
    # the root requirements.txt retrieval block (rank-bm25==0.2.2 pinned there).
    "rank-bm25>=0.2.2",
    # Langfuse client — backs rag/observability/tracing.py (Langfuse client)
    # imported transitively by orchestrator/guardrails; pinned <3 because the
    # code uses the v2 trace()/generation()/event() API that langfuse 3.x
    # removed. Mirrors the root requirements.txt observability block.
    "langfuse>=2.55.0,<3",
    # Observability — backs rag/observability/ (tracing.py, decorators.py,
    # diagnose.py) and rag/messenger/routers/webhook.py span instrumentation.
    # Mirrors the opentelemetry block in the root requirements.txt (Docker).
    # These were previously installed out-of-band; declaring them here ensures
    # `uv sync` keeps them instead of removing them.
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    # Meta-package that provides the proto.grpc OTLP exporter imported by
    # rag/observability/tracing.py (opentelemetry.exporter.otlp.proto.grpc).
    "opentelemetry-exporter-otlp>=1.28.0",
    # opentelemetry-instrumentation-fastapi ships as a pre-release (0.49b2).
    # The prerelease = "allow" setting below is required for uv to resolve it.
    "opentelemetry-instrumentation-fastapi>=0.49b2",
    # Backs the LangGraph orchestrator in rag/orchestrator/graph.py
    # (StateGraph, START/END, MemorySaver, AsyncPostgresSaver).
    # Mirrors the root requirements.txt orchestration block (langgraph==0.2.59,
    # langgraph-checkpoint-postgres==2.0.7). Upper bound <0.3 guards against
    # API breakage introduced in the 0.3.x rewrite.
    "langgraph>=0.2.59,<0.3",
    "langgraph-checkpoint-postgres>=2.0.7",
]

[tool.uv]
package = false
# Required so uv resolves opentelemetry-instrumentation-fastapi which ships
# on a pre-release versioning scheme (0.49b2, 0.50b0, etc.).  Without this,
# uv's default "disallow prereleases" policy rejects the 0.49bN line.
prerelease = "allow"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Repo root on sys.path so `from rag.X import Y` resolves the same way
# the container does (`PYTHONPATH=/app`). pyproject.toml lives at
# rag/pyproject.toml so ".." is the repo root.
pythonpath = [".."]
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that exercise multiple modules or mock external services",
]

[dependency-groups]
dev = [
    "fakeredis>=2.35.1",
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    "pytest-cov>=6.0.0,<7",
    "ruff>=0.8.0,<1",
    # Phase 28 Part 2 — static type checking gate. Run via:
    #   uv run --group dev mypy --strict rag/routers/profile.py rag/services/object_store.py
    "mypy>=1.13.0,<2",
    "types-aioboto3>=13.0.0,<15",
    "moto[s3,server]>=5.0.0,<6",
]

[tool.mypy]
python_version = "3.11"
strict = true
# Run from repo root so ``rag.*`` package paths resolve. The pyproject lives
# at ``rag/pyproject.toml`` so the ``files`` paths use the ``rag/...`` prefix.
# Invocation:  uv run --project rag mypy --config-file rag/pyproject.toml
explicit_package_bases = true
namespace_packages = true
# Strict gate is scoped to NEW code shipped in Phase 28 — pre-existing v1/v2
# modules are not annotated to the same bar yet. Add modules here only after
# they're brought up to strict cleanliness.
files = [
    "rag/routers/admin_users.py",
    "rag/routers/profile.py",
    "rag/services",
    "rag/scripts/phase28_bootstrap_minio.py",
]

[[tool.mypy.overrides]]
module = ["aioboto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true

# Phase 27 auth modules are transitively imported by the Phase 28 strict
# gate but were never annotated to that bar. Soften strict here so the
# Part 2 work isn't blocked on a v2/v3 typing backfill.
[[tool.mypy.overrides]]
module = ["rag.auth.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["type-arg"]
