# Phase 8 — nginx vhost for the docker-compose Messenger surface.
#
# Sits alongside the existing chat.nexus.gayo-sphere.cloud vhost (which still
# proxies to the v1 systemd unit on 127.0.0.1:8501). Rolling this back is one
# `rm` + `systemctl reload nginx`.
#
# Install:
#   cp infra/nginx/messenger.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/messenger.conf /etc/nginx/sites-enabled/
#   certbot --nginx -d messenger.nexus.gayo-sphere.cloud
#   nginx -t && systemctl reload nginx

# --- HTTP → HTTPS redirect ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name messenger.nexus.gayo-sphere.cloud;

    # Allow Let's Encrypt ACME http-01 challenges to pass through.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS terminator → docker api:8000 --------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name messenger.nexus.gayo-sphere.cloud;

    # certbot --nginx populates these on first run.
    ssl_certificate     /etc/letsencrypt/live/messenger.nexus.gayo-sphere.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/messenger.nexus.gayo-sphere.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Webhook bodies are tiny; cap at 1 MiB to absorb image-link metadata.
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Per-IP rate limit at the edge (defense-in-depth on top of the
    # app-level per-user limiter in rag/messenger/ratelimit.py).
    # Define the zone once in /etc/nginx/conf.d/ratelimit.conf:
    #     limit_req_zone $binary_remote_addr zone=nexus_edge:10m rate=30r/s;
    limit_req zone=nexus_edge burst=60 nodelay;
    limit_req_status 429;

    access_log /var/log/nginx/messenger.nexus.access.log;
    error_log  /var/log/nginx/messenger.nexus.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE/streaming-friendly. Tune up if a graph run takes longer.
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
