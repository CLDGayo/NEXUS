# OpenTelemetry Collector config — Phase 26.
#
# Mounted into the `otel-collector` service at /etc/otel-collector-config.yaml.
# api + outbound_worker export OTLP/gRPC to otel-collector:4317; the collector
# fans out to two exporters:
#
#   1. debug   — stdout tee (forensic visibility via `docker logs`)
#   2. otlphttp/langfuse — POSTs span batches to the in-network Langfuse v3
#      OTel ingest endpoint with HTTP Basic auth derived from the project's
#      public/secret API keys (minted in the Langfuse UI on first launch).
#
# Metrics and logs pipelines stay on stdout — Langfuse only ingests traces.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 2s
    limit_percentage: 75
    spike_limit_percentage: 25

exporters:
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

  # Langfuse v3 native OTel ingest. Auth header is
  #   "Basic " + base64("<LANGFUSE_PUBLIC_KEY>:<LANGFUSE_SECRET_KEY>")
  # Build LANGFUSE_OTEL_AUTH_B64 in .env.prod and inject it into the collector
  # service environment; the Collector substitutes ${env:VAR} at parse time.
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTEL_AUTH_B64}"
    compression: gzip
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlphttp/langfuse]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
  telemetry:
    logs:
      level: info
